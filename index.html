<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080e14">
<title>Vipin Singh | Sports Community</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: #f7f9fc;
    font-family: Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 15% 12%, rgba(0,168,255,.10), transparent 27%),
      radial-gradient(circle at 90% 75%, rgba(0,168,255,.08), transparent 30%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 13px),
      #080e14;
    display: flex; justify-content: center;
  }
  .page { width: 100%; max-width: 680px; padding: 30px 20px 42px; text-align: center; }
  h1 { margin: 4px 0 24px; font-size: clamp(27px, 6vw, 43px); line-height: 1.15; font-weight: 900; letter-spacing: .2px; }
  .profile {
    width: clamp(170px, 47vw, 245px); aspect-ratio: 1; object-fit: cover;
    border-radius: 50%; border: 3px solid #ffd400; padding: 3px;
    box-shadow: 0 0 28px rgba(255,212,0,.16); background: #101820;
  }
  .tagline { margin: 23px 0 18px; font-size: clamp(22px, 5vw, 32px); font-weight: 800; }
  .stars { color: #00bfff; letter-spacing: 12px; font-size: 27px; margin: 20px 0 26px; }
  .stay { font-size: clamp(18px, 4.5vw, 25px); font-weight: 700; margin: 0 0 30px; }
  .join {
    display: flex; align-items: center; justify-content: center; gap: 11px;
    width: min(100%, 500px); min-height: 76px; margin: 0 auto;
    padding: 15px 18px; border-radius: 50px; text-decoration: none;
    color: white; font-size: clamp(21px, 5vw, 30px); font-weight: 900;
    background: linear-gradient(100deg, #009bfa, #08b8ff);
    border: 6px dashed white; outline: 2px solid #009bfa;
    box-shadow: 0 9px 25px rgba(0,155,250,.22);
    transition: transform .18s ease, filter .18s ease;
  }
  .join:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .telegram { display:inline-grid; place-items:center; width:34px; height:34px; flex:0 0 34px; border-radius:50%; background:white; color:#079fe9; font-size:20px; }
  .updates { display:flex; align-items:center; justify-content:center; gap:18px; margin: 35px auto 28px; }
  .number { color:#00c5f4; font-size: clamp(72px, 15vw, 100px); line-height:.9; font-weight:900; }
  .updates span:last-child { font-size: clamp(16px, 3.8vw, 23px); letter-spacing: 3px; text-align:left; }
  .features { margin: 24px 0 26px; font-size: clamp(21px, 4.8vw, 30px); line-height: 1.95; font-weight: 900; }
  .feature { display:block; }
  .bottom-stars { display:flex; justify-content:space-around; max-width:480px; margin: 18px auto 32px; font-size:24px; }
  .credit { font-size: clamp(18px, 4.5vw, 25px); font-weight:700; margin-top: 25px; }
  @media (max-width:380px) { .page { padding-left:14px; padding-right:14px; } .join { min-height:66px; border-width:5px; } }
</style>
</head>
